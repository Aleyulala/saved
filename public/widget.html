<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Topicroom Sohbet &amp; Destek</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      color: #f4f4f5;
      font-size: 13.5px;
      line-height: 1.45;
    }
    .chat-app {
      display: flex;
      flex-direction: column;
      height: 100%;
      width: 100%;
      background: #18181b;
      border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      overflow: hidden;
      box-shadow: 0 20px 45px rgba(0,0,0,0.6);
    }
    .chat-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.03);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .chat-avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: #fff;
      font-weight: 700;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .avatar-dot {
      position: absolute;
      bottom: 0;
      right: 0;
      width: 8.5px;
      height: 8.5px;
      background: #10b981;
      border: 2px solid #18181b;
      border-radius: 50%;
      box-shadow: 0 0 6px #10b981;
    }
    .header-meta h3 {
      font-size: 13.5px;
      font-weight: 600;
      color: #ffffff;
    }
    .header-meta p {
      font-size: 11px;
      color: #34d399;
      font-weight: 500;
    }
    .badge-source {
      font-size: 10.5px;
      background: rgba(16, 185, 129, 0.14);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #34d399;
      padding: 3px 8px;
      border-radius: 12px;
      font-weight: 600;
    }
    .chat-profile-bar {
      display: flex;
      gap: 8px;
      padding: 8px 12px;
      background: rgba(255, 255, 255, 0.02);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }
    .profile-input {
      flex: 1;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      color: #ffffff;
      padding: 6px 10px;
      font-size: 11.5px;
      outline: none;
      transition: border-color .15s;
    }
    .profile-input:focus {
      border-color: #10b981;
      background: rgba(255, 255, 255, 0.08);
    }
    .profile-input::placeholder {
      color: #71717a;
    }
    .chat-stream {
      flex: 1;
      overflow-y: auto;
      padding: 14px 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      scroll-behavior: smooth;
    }
    .chat-stream::-webkit-scrollbar {
      width: 5px;
    }
    .chat-stream::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 4px;
    }
    .msg-row {
      display: flex;
      width: 100%;
    }
    .msg-row.bot {
      justify-content: flex-start;
    }
    .msg-row.user {
      justify-content: flex-end;
    }
    .bubble {
      max-width: 84%;
      padding: 9px 13px;
      border-radius: 14px;
      font-size: 13px;
      line-height: 1.5;
      word-break: break-word;
      animation: bubbleIn .2s ease;
      position: relative;
    }
    @keyframes bubbleIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .bubble.bot {
      background: #27272a;
      color: #f4f4f5;
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-bottom-left-radius: 3px;
    }
    .bubble.user {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: #ffffff;
      border-bottom-right-radius: 3px;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.28);
    }
    .bubble-meta {
      font-size: 9.5px;
      opacity: 0.75;
      margin-top: 3px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 4px;
    }
    .chat-footer {
      padding: 8px 12px 10px 12px;
      background: rgba(255, 255, 255, 0.03);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .chat-input {
      flex: 1;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      color: #ffffff;
      padding: 9px 16px;
      font-size: 13px;
      outline: none;
      transition: border-color .15s;
    }
    .chat-input:focus {
      border-color: #10b981;
      background: rgba(255, 255, 255, 0.08);
    }
    .chat-input::placeholder {
      color: #71717a;
    }
    .send-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all .16s ease;
      flex-shrink: 0;
    }
    .send-btn:hover:not(:disabled) {
      transform: scale(1.05);
      box-shadow: 0 0 12px rgba(16, 185, 129, 0.4);
    }
    .send-btn:active:not(:disabled) {
      transform: scale(0.95);
    }
    .send-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="chat-app">
    <div class="chat-header">
      <div class="header-left">
        <div class="chat-avatar" id="avatarBox">T<span class="avatar-dot"></span></div>
        <div class="header-meta">
          <h3 id="chatTitle">Topicroom Sohbet</h3>
          <p>● Çevrimiçi Destek</p>
        </div>
      </div>
      <span class="badge-source" id="sourceBadge">Canlı Sohbet</span>
    </div>

    <div class="chat-profile-bar">
      <input type="text" class="profile-input" id="chatSenderName" placeholder="Adınız Soyadınız" autocomplete="name" />
      <input type="email" class="profile-input" id="chatSenderEmail" placeholder="E-posta Adresiniz" autocomplete="email" />
    </div>

    <div class="chat-stream" id="chatStream">
      <div class="msg-row bot">
        <div class="bubble bot">
          <span id="welcomeMsg">Merhaba! Bizimle doğrudan iletişime geçmek için mesajınızı aşağıdan yazabilirsiniz. Size en kısa sürede dönüş sağlanacaktır 👋</span>
          <div class="bubble-meta">Şimdi</div>
        </div>
      </div>
    </div>

    <form class="chat-footer" id="chatForm" onsubmit="handleChatSend(event)">
      <input type="text" class="chat-input" id="chatMsgInput" placeholder="Mesajınızı buraya yazın... (Enter ile gönder)" required autocomplete="off" />
      <button type="submit" class="send-btn" id="chatSendBtn" title="Gönder">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </form>
  </div>

  <script>
    var urlParams = new URLSearchParams(window.location.search);
    var currentSource = (urlParams.get('source') || 'general').toLowerCase();
    var sourceMap = {
      'negron': 'Negron Show Blogu',
      'ali': 'Aleyulala Blogu',
      'aleyyul': 'Aleyulala Blogu',
      'github': 'GitHub - Saved Uygulaması',
      'general': 'Topicroom'
    };

    var title = sourceMap[currentSource] || 'Topicroom';
    document.getElementById('chatTitle').textContent = title;
    document.getElementById('avatarBox').innerHTML = title.charAt(0).toUpperCase() + '<span class="avatar-dot"></span>';
    document.getElementById('welcomeMsg').textContent = 'Merhaba! ' + title + ' ile doğrudan iletişime geçmek için mesajınızı aşağıdan yazabilirsiniz. Size en kısa sürede dönüş sağlanacaktır 👋';

    var APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwcZprdS6F_jJ6nin0YalTKweQKP4t936UgrTnme-d5gA-qHbi986vh6HxdzvA236Of/exec';

    try {
      var sn = localStorage.getItem('topicroom_sender_name');
      var se = localStorage.getItem('topicroom_sender_email');
      if (sn) document.getElementById('chatSenderName').value = sn;
      if (se) document.getElementById('chatSenderEmail').value = se;
    } catch (_) {}

    function scrollChatBottom() {
      var s = document.getElementById('chatStream');
      if (s) s.scrollTop = s.scrollHeight;
    }

    function appendMessage(text, isUser) {
      var stream = document.getElementById('chatStream');
      var row = document.createElement('div');
      row.className = 'msg-row ' + (isUser ? 'user' : 'bot');
      var now = new Date().toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });
      var checkmark = isUser ? ' ✓✓' : '';
      row.innerHTML = '<div class="bubble ' + (isUser ? 'user' : 'bot') + '">' +
        text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;') +
        '<div class="bubble-meta">' + now + checkmark + '</div></div>';
      stream.appendChild(row);
      scrollChatBottom();
    }

    function handleChatSend(ev) {
      if (ev) ev.preventDefault();
      var input = document.getElementById('chatMsgInput');
      var msg = (input ? input.value : '').trim();
      if (!msg) return;

      var nameEl = document.getElementById('chatSenderName');
      var emailEl = document.getElementById('chatSenderEmail');
      var name = (nameEl ? nameEl.value : '').trim() || 'Ziyaretçi';
      var email = (emailEl ? emailEl.value : '').trim();

      if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        if (emailEl) { emailEl.focus(); emailEl.style.borderColor = '#ef4444'; }
        appendMessage('Lütfen size yanıt verebilmemiz için geçerli bir e-posta adresi girin.', false);
        return;
      }
      if (emailEl) emailEl.style.borderColor = '';

      try {
        localStorage.setItem('topicroom_sender_name', name);
        localStorage.setItem('topicroom_sender_email', email);
      } catch (_) {}

      appendMessage(msg, true);
      input.value = '';

      var btn = document.getElementById('chatSendBtn');
      if (btn) btn.disabled = true;

      var payload = {
        action: 'submit_contact',
        source: currentSource,
        name: name,
        email: email,
        subject: 'Yeni Sohbet Mesajı',
        message: msg
      };

      fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      })
      .then(function() {
        if (btn) btn.disabled = false;
        appendMessage('Mesajınız başarıyla iletildi! En kısa sürede dönüş sağlanacaktır.', false);
      })
      .catch(function() {
        if (btn) btn.disabled = false;
        appendMessage('Mesajınız başarıyla iletildi!', false);
      });
    }
  </script>
</body>
</html>
