<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>#İletişim - Nsone Bot</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0b0d13;
      color: #f1f5f9;
      font-size: 13.5px;
      line-height: 1.45;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
    }

    /* CARD CONTAINER: Sabit Mobil Telefon Boyutu (Vivo Y35 Uyumlu) */
    .cf-card-wrap {
      width: 380px;
      max-width: calc(100vw - 20px);
      height: 530px;
      max-height: min(92vh, 550px);
      background: #0f121a;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.65), 0 2px 10px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
      animation: cfCardIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes cfCardIn {
      from { opacity: 0; transform: scale(0.96) translateY(6px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    /* HEADER: #İletişim Ortalanmış + Şık Kapat Butonu */
    .cf-bot-header {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px 18px 12px 18px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      background: rgba(22, 27, 38, 0.85);
      flex-shrink: 0;
    }
    .cf-bot-name {
      font-size: 15.5px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.3px;
      text-align: center;
      margin: 0 auto;
    }
    .cf-close-btn {
      display: none !important;
      visibility: hidden !important;
      pointer-events: none !important;
    }

    /* CHAT STREAM & BUBBLES - Sabit Alan, Asla Büyüyüp Küçülmez */
    .cf-chat-messages {
      flex: 1 1 0%;
      min-height: 0;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, 0.12) transparent;
    }
    .cf-chat-messages::-webkit-scrollbar {
      width: 5px;
    }
    .cf-chat-messages::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.12);
      border-radius: 4px;
    }

    .cf-bubble-stack {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .cf-chat-bubble {
      background: rgba(255, 255, 255, 0.06);
      border: none;
      color: #f1f5f9;
      padding: 11px 14px;
      border-radius: 16px 16px 16px 4px;
      max-width: 88%;
      align-self: flex-start;
      font-size: 13px;
      line-height: 1.45;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.15);
      animation: cfFadeIn 0.25s ease;
    }
    .cf-user-bubble {
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      color: #ffffff;
      border: none;
      border-radius: 16px 16px 4px 16px;
      max-width: 85%;
      align-self: flex-end;
      text-align: left;
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.32);
    }
    .cf-bubble-meta {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 4px;
      font-size: 10.5px;
      color: rgba(255, 255, 255, 0.6);
      margin-top: 4px;
    }
    .cf-double-check {
      width: 14px;
      height: 14px;
      stroke: #38bdf8;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }
    .cf-bubble-ack {
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.22);
      color: #a7f3d0;
      border-radius: 14px 14px 14px 4px;
      padding: 8px 12px;
      font-size: 12.5px;
      align-self: flex-start;
      animation: cfFadeIn 0.25s ease;
    }

    @keyframes cfFadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* FORM & SLIDES */
    .cf-form-area {
      padding: 8px 14px 10px 14px;
      background: rgba(20, 24, 34, 0.95);
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      flex-shrink: 0;
    }
    .cf-slider-container {
      position: relative;
      width: 100%;
      min-height: 46px;
    }
    .cf-slide {
      display: none;
      align-items: center;
      gap: 8px;
      width: 100%;
    }
    .cf-slide.active {
      display: flex;
      animation: cfFadeIn 0.2s ease;
    }
    .cf-input-field {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
    }
    .cf-input-field input,
    .cf-input-field textarea {
      width: 100%;
      height: 42px;
      min-height: 42px;
      max-height: 42px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 10px 13px;
      color: #ffffff;
      font-size: 13px;
      outline: none;
      transition: all 0.2s ease;
      box-sizing: border-box;
    }
    .cf-input-field textarea {
      resize: none;
      line-height: 20px;
      overflow: hidden;
    }
    .cf-input-field input:focus,
    .cf-input-field textarea:focus {
      border-color: #0284c7;
      background: rgba(255, 255, 255, 0.08);
      box-shadow: 0 0 0 2px rgba(2, 132, 199, 0.25);
    }
    .cf-input-field input::placeholder,
    .cf-input-field textarea::placeholder {
      color: #64748b;
    }

    /* ACTION BUTTONS (Squircle Corners: Send + Close at bottom right) */
    .cf-btn-next {
      width: 42px;
      height: 42px;
      min-width: 42px;
      min-height: 42px;
      border-radius: 12px;
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      color: #ffffff;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.35);
      transition: all 0.2s ease;
    }
    .cf-btn-next:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(2, 132, 199, 0.45);
    }
    .cf-btn-next:active:not(:disabled) {
      transform: scale(0.96);
    }
    .cf-btn-next:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      box-shadow: none;
    }
    .cf-btn-next svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    .cf-btn-bottom-close {
      width: 42px;
      height: 42px;
      min-width: 42px;
      min-height: 42px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #94a3b8;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.2s ease;
    }
    .cf-btn-bottom-close:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #ffffff;
      transform: translateY(-1px);
    }
    .cf-btn-bottom-close:active {
      transform: scale(0.96);
    }
    .cf-btn-bottom-close svg {
      width: 17px;
      height: 17px;
      stroke: currentColor;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    /* FOOTER BAR: Sol Alt Status + Sağ Alt Yazıyor Bildirimi */
    .cf-footer-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 4px 2px 4px;
      width: 100%;
      box-sizing: border-box;
      position: relative;
    }
    .cf-footer-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11.5px;
      color: #10b981;
      font-weight: 600;
      position: static !important;
    }
    .cf-online-dot {
      width: 7px !important;
      height: 7px !important;
      min-width: 7px !important;
      min-height: 7px !important;
      background-color: #10b981 !important;
      border-radius: 50% !important;
      display: inline-block !important;
      position: static !important;
      box-shadow: 0 0 8px rgba(16, 185, 129, 0.7) !important;
    }
    .cf-status-label {
      color: #10b981;
      font-size: 11.5px;
    }

    /* Nsone Bot yazıyor... Bildirimi (TAMAMEN BORDERSIZ / ÇERÇEVESİZ) */
    .cf-typing-indicator {
      display: none;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      color: #94a3b8;
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      padding: 0 !important;
      animation: cfFadeIn 0.2s ease;
    }
    .cf-typing-dots {
      display: flex;
      gap: 3px;
    }
    .cf-typing-dots span {
      width: 4px;
      height: 4px;
      background: #38bdf8;
      border-radius: 50%;
      animation: cfBlink 1.4s infinite;
    }
    .cf-typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .cf-typing-dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes cfBlink {
      0%, 80%, 100% { opacity: 0.2; transform: scale(0.8); }
      40% { opacity: 1; transform: scale(1.1); }
    }

    /* SOSYAL MEDYA KATILIM BUTONU VE KARTLARI */
    .cf-social-invite {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 8px;
    }
    .cf-social-trigger-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 9px 15px;
      border-radius: 12px;
      background: rgba(2, 132, 199, 0.16);
      border: 1px solid rgba(2, 132, 199, 0.38);
      color: #38bdf8;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
      width: fit-content;
    }
    .cf-social-trigger-btn:hover {
      background: rgba(2, 132, 199, 0.3);
      border-color: #38bdf8;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.25);
    }
    .cf-social-links-grid {
      display: flex;
      flex-direction: column;
      gap: 7px;
      margin-top: 8px;
      width: 100%;
    }
    .cf-soc-pill {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.09);
      color: #f1f5f9;
      text-decoration: none;
      font-size: 12px;
      font-weight: 500;
      transition: all 0.2s ease;
    }
    .cf-soc-pill:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.2);
      transform: translateX(3px);
      color: #ffffff;
    }
    .cf-soc-pill svg {
      width: 15px;
      height: 15px;
      flex-shrink: 0;
    }
    .cf-soc-pill.ig:hover { border-color: #e1306c; color: #fb7185; }
    .cf-soc-pill.tg:hover { border-color: #229ed9; color: #38bdf8; }
    .cf-soc-pill.yt:hover { border-color: #ff0000; color: #f87171; }
    .cf-soc-pill.gh:hover { border-color: #a855f7; color: #c084fc; }

    /* MOBİL UYGULAMA UYUMU */
    @media (max-width: 480px) {
      .cf-card-wrap {
        width: min(calc(100vw - 20px), 390px) !important;
        max-width: 390px !important;
        border-radius: 20px !important;
      }
      .cf-chat-messages {
        padding: 12px 14px;
      }
      .cf-form-area {
        padding: 8px 12px 10px 12px;
      }
    }
  </style>
</head>
<body>
  <div class="cf-card-wrap" id="cfCard">
    <!-- HEADER: #İletişim Ortalanmış (Üstte Çarpı Yok - Sadece Sağ Altta) -->
    <div class="cf-bot-header">
      <h3 class="cf-bot-name">#İletişim</h3>
    </div>

    <!-- CHAT MESSAGES STREAM -->
    <div class="cf-chat-messages" id="cfChatMessages">
      <div class="cf-bubble-stack" id="cfBubbleStack">
        <div class="cf-chat-bubble">
          <span>Merhaba! 👋 dostum</span>
        </div>
        <div class="cf-chat-bubble">
          <span>Bir sorunuz, öneriniz veya mesajınız varsa lütfen aşağıdaki formu doldurarak bize iletin.</span>
        </div>
        <div class="cf-chat-bubble">
          <span>Size e-posta adresinizden en kısa sürede dönüş yapacağız.</span>
          <div class="cf-bubble-meta">
            <span>Şimdi</span>
            <svg class="cf-double-check" viewBox="0 0 24 24"><path d="M18 6L7 17l-5-5M22 10l-7.5 7.5L13 16"></path></svg>
          </div>
        </div>
      </div>
    </div>

    <!-- FORM & CAROUSEL SLIDES -->
    <div class="cf-form-area">
      <form id="cfForm" onsubmit="return false;">
        <div class="cf-slider-container">
          <!-- 0. Ad (İsim) Slaytı -->
          <div class="cf-slide active" id="cfSlideName">
            <div class="cf-input-field">
              <input type="text" id="cfInputName" placeholder="Adınız ve soyadınız... (Enter)" required autocomplete="name" />
            </div>
            <button type="button" class="cf-btn-next" id="cfNext1" title="İleri" onclick="handleNext1()">
              <svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
            </button>
            <button type="button" class="cf-btn-bottom-close" title="Kapat" onclick="handleWidgetClose()">
              <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
          </div>

          <!-- 1. E-posta Slaytı -->
          <div class="cf-slide" id="cfSlideEmail">
            <div class="cf-input-field">
              <input type="email" id="cfInputEmail" placeholder="E-posta adresiniz... (Enter)" required autocomplete="email" />
            </div>
            <button type="button" class="cf-btn-next" id="cfNext2" title="İleri" onclick="handleNext2()">
              <svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
            </button>
            <button type="button" class="cf-btn-bottom-close" title="Kapat" onclick="handleWidgetClose()">
              <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
          </div>

          <!-- 2. Mesaj Slaytı (Maksimum 3 Mesaj Sınırı) -->
          <div class="cf-slide" id="cfSlideMsg">
            <div class="cf-input-field">
              <textarea id="cfInputMsg" placeholder="Mesajınızı buraya yazın... (Enter)" rows="1" required></textarea>
            </div>
            <button type="button" class="cf-btn-next" id="cfNext3" title="Gönder" onclick="handleSendMsg()">
              <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            </button>
            <button type="button" class="cf-btn-bottom-close" title="Kapat" onclick="handleWidgetClose()">
              <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
          </div>
        </div>
      </form>

      <!-- FOOTER BAR: Sol Alt Status + Sağ Alt Yazıyor Bildirimi (Border Yok) -->
      <div class="cf-footer-bar">
        <div class="cf-footer-status">
          <span class="cf-online-dot"></span>
          <span class="cf-status-label">Nsone Bot • Çevrimiçi</span>
        </div>
        <div class="cf-typing-indicator" id="cfTypingIndicator">
          <div class="cf-typing-dots"><span></span><span></span><span></span></div>
          <span class="cf-typing-text">Nsone Bot yazıyor...</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    var APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby2BbaRplWrOLZDiTba4Wnn9LAy6m2IuIBDmhFS6aSYr-fagSGVKbw_PYb9aajK39jZ/exec';
    var MAX_MESSAGES = 3;

    var chatData = {
      name: '',
      email: '',
      messagesCount: 0
    };

    var slideName = document.getElementById('cfSlideName');
    var slideEmail = document.getElementById('cfSlideEmail');
    var slideMsg = document.getElementById('cfSlideMsg');
    var inputName = document.getElementById('cfInputName');
    var inputEmail = document.getElementById('cfInputEmail');
    var inputMsg = document.getElementById('cfInputMsg');
    var bubbleStack = document.getElementById('cfBubbleStack');
    var messagesArea = document.getElementById('cfChatMessages');
    var typingIndicator = document.getElementById('cfTypingIndicator');

    function scrollToBottom() {
      if (messagesArea) {
        messagesArea.scrollTo({ top: messagesArea.scrollHeight, behavior: 'smooth' });
      }
    }

    function appendUserBubble(text) {
      if (!bubbleStack) return;
      var el = document.createElement('div');
      el.className = 'cf-chat-bubble cf-user-bubble';
      var safeText = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      el.innerHTML = '<span>' + safeText + '</span>' +
        '<div class="cf-bubble-meta">' +
          '<span>Şimdi</span>' +
          '<svg class="cf-double-check" viewBox="0 0 24 24"><path d="M18 6L7 17l-5-5M22 10l-7.5 7.5L13 16"></path></svg>' +
        '</div>';
      bubbleStack.appendChild(el);
      scrollToBottom();
    }

    function appendBotBubble(htmlText, isAck) {
      if (!bubbleStack) return;
      var el = document.createElement('div');
      el.className = 'cf-chat-bubble' + (isAck ? ' cf-bubble-ack' : '');
      el.innerHTML = htmlText;
      bubbleStack.appendChild(el);
      scrollToBottom();
    }

    function autoResize() {
      // Sabit mobil boyut koruması: Textarea yüksekliği kutuyu esnetmez
    }

    if (inputMsg) {
      inputMsg.addEventListener('input', autoResize);
    }

    function handleNext1() {
      var val = (inputName ? inputName.value : '').trim();
      if (!val || val.length < 2) {
        if (inputName) inputName.focus();
        return;
      }
      chatData.name = val;
      appendUserBubble(val);
      slideName.classList.remove('active');
      slideEmail.classList.add('active');
      if (inputEmail) setTimeout(function() { inputEmail.focus(); }, 120);
    }

    function handleNext2() {
      var val = (inputEmail ? inputEmail.value : '').trim();
      if (!val || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val)) {
        if (inputEmail) inputEmail.focus();
        return;
      }
      chatData.email = val;
      appendUserBubble(val);
      slideEmail.classList.remove('active');
      slideMsg.classList.add('active');
      if (inputMsg) setTimeout(function() { inputMsg.focus(); autoResize(); }, 120);
    }

    // Sadece 3 mesaja kadar izin ver (3'ten fazla mesaj balonu atılmasın)
    function handleSendMsg() {
      if (chatData.messagesCount >= MAX_MESSAGES) {
        return;
      }
      var val = (inputMsg ? inputMsg.value : '').trim();
      if (!val) {
        if (inputMsg) inputMsg.focus();
        return;
      }

      chatData.messagesCount++;
      appendUserBubble(val);
      inputMsg.value = '';
      autoResize();

      // Sağ altta Nsone Bot yazıyor... göster
      if (typingIndicator) typingIndicator.style.display = 'flex';

      // Gönderim: Her iki e-postaya da iletilir
      var payload = {
        action: 'submit_contact',
        source: 'negron',
        name: chatData.name,
        email: chatData.email,
        message: val
      };

      try {
        var bkUrl = APPS_SCRIPT_URL + '?action=submit_contact' +
          '&source=negron' +
          '&name=' + encodeURIComponent(chatData.name) +
          '&email=' + encodeURIComponent(chatData.email) +
          '&message=' + encodeURIComponent(val);
        new Image().src = bkUrl;
      } catch (_) {}

      if (typeof google !== 'undefined' && google.script && google.script.run) {
        try { google.script.run.submitContactFormFromWidget(payload); } catch (_) {}
      }

      setTimeout(function() {
        if (typingIndicator) typingIndicator.style.display = 'none';

        if (chatData.messagesCount === 1) {
          appendBotBubble('<span>Mesajını ilettik! İletmek istediğin başka bir konu varsa aşağıdan yazmaya devam edebilirsin. 👇 (1/3)</span>', true);
          if (inputMsg) {
            inputMsg.placeholder = 'Yeni bir mesaj yazın... (2/3)';
            inputMsg.focus();
          }
        } else if (chatData.messagesCount === 2) {
          appendBotBubble('<span>Ek mesajını da ilettik. ✓✓ (2/3)</span>', true);
          if (inputMsg) {
            inputMsg.placeholder = 'Son mesajınızı yazın... (3/3)';
            inputMsg.focus();
          }
        } else if (chatData.messagesCount >= 3) {
          appendBotBubble('<span>Mesajın kaydedildi. En kısa sürede e-posta adresine dönüş sağlayacağız. 👍 (3/3)</span><div class="cf-social-invite"><button type="button" id="cfSocialTriggerBtn" class="cf-social-trigger-btn" onclick="showSocialLinks()"><svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>Sosyal Ağlarımıza Katılmak İster misin? ✨</button></div>', true);
          // 3 mesaja ulaşıldığında kitle
          if (inputMsg) {
            inputMsg.disabled = true;
            inputMsg.placeholder = 'Maksimum mesaj limitine ulaşıldı (3/3).';
          }
          var btn = document.getElementById('cfNext3');
          if (btn) {
            btn.disabled = true;
            btn.style.opacity = '0.35';
            btn.style.cursor = 'not-allowed';
          }
        }
      }, 400);
    }

    if (inputName) {
      inputName.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') { e.preventDefault(); handleNext1(); }
      });
    }
    if (inputEmail) {
      inputEmail.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') { e.preventDefault(); handleNext2(); }
      });
    }
    if (inputMsg) {
      inputMsg.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSendMsg(); }
      });
    }

        inviteBtn.disabled = true;

      var socialHtml = '<span>🌟 <b>Topluluk & Sosyal Ağlarımız:</b></span>' +

            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22.54 6.42a2.78 2.78 0 0 0-1.94-2C18.88 4 12 4 12 4s-6.88 0-8.6.46a2.78 2.78 0 0 0-1.94 2A29 29 0 0 0 1 11.75a29 29 0 0 0 .46 5.33A2.78 2.78 0 0 0 3.4 19c1.72.46 8.6.46 8.6.46s6.88 0 8.6-.46a2.78 2.78 0 0 0 1.94-2 29 29 0 0 0 .46-5.25 29 29 0 0 0-.46-5.33z"></path><polygon points="9.75 15.02 15.5 11.75 9.75 8.48 9.75 15.02"></polygon></svg>' +
            '<span>YouTube (@ngronn)</span>' +

            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"></path></svg>' +
            '<span>GitHub Topluluk & Tartışmalar</span>' +
          '</a>' +
        '</div>';
      appendBotBubble(socialHtml, true);
    }

    function handleWidgetClose() {
      try {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ action: 'close_contact_widget', type: 'topicroom_contact_close' }, '*');
        }
      } catch (_) {}
      var card = document.getElementById('cfCard');
      if (card) {
        card.style.transition = 'all 0.22s ease';
        card.style.opacity = '0';
        card.style.transform = 'scale(0.96)';
      }
    }
  </script>
