<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Topicroom İletişim</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    html, body {
      background: transparent;
      color: #e4e4e7;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 10px;
      font-size: 13.5px;
      overflow-x: hidden;
    }
    .widget-card {
      background: #18181b;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 20px 22px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.55);
      position: relative;
      overflow: hidden;
      max-width: 480px;
      margin: 0 auto;
      width: 100%;
    }
    .widget-card::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, #10b981, #38bdf8);
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }
    .badge-wrap {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.25);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11.5px;
      font-weight: 600;
      color: #34d399;
    }
    .pulse-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 8px #10b981;
      animation: pulseDot 2s infinite ease-in-out;
    }
    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }
    .status-text {
      font-size: 11px;
      color: #71717a;
      font-weight: 500;
    }
    .form-group {
      margin-bottom: 10px;
    }
    .label {
      display: block;
      font-size: 11px;
      font-weight: 500;
      color: #a1a1aa;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }
    .input, .textarea {
      width: 100%;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 9px;
      color: #fafafa;
      padding: 8px 12px;
      font-size: 13px;
      outline: none;
      transition: border-color 0.18s, box-shadow 0.18s, background-color 0.18s;
    }
    .input:focus, .textarea:focus {
      border-color: #10b981;
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15);
      background: rgba(255, 255, 255, 0.07);
    }
    .textarea {
      resize: vertical;
      min-height: 80px;
      max-height: 180px;
      line-height: 1.5;
    }
    .row {
      display: flex;
      gap: 10px;
    }
    .row .form-group {
      flex: 1;
    }
    .submit-btn {
      width: 100%;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: #ffffff;
      font-weight: 600;
      padding: 10px 16px;
      border-radius: 9px;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 13.5px;
      transition: all 0.18s;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.28);
      margin-top: 4px;
    }
    .submit-btn:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(16, 185, 129, 0.38);
    }
    .submit-btn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      transform: none;
    }
    .alert {
      padding: 9px 12px;
      border-radius: 8px;
      font-size: 12px;
      margin-bottom: 10px;
      display: none;
    }
    .alert-error {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
    }
    .success-card {
      display: none;
      text-align: center;
      padding: 20px 8px;
    }
    .success-icon {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(16, 185, 129, 0.15);
      border: 2px solid #10b981;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 14px auto;
      color: #10b981;
    }
    .success-title {
      font-size: 16px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 6px;
    }
    .success-desc {
      font-size: 12.5px;
      color: #a1a1aa;
      line-height: 1.55;
      margin-bottom: 18px;
    }
    .btn-reset {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #ffffff;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 12.5px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.18s;
    }
    .btn-reset:hover {
      background: rgba(255, 255, 255, 0.15);
    }
    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin .6s linear infinite;
      display: inline-block;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="widget-card">
    <div id="formView">
      <div class="header">
        <div class="badge-wrap">
          <span class="pulse-dot"></span>
          <span id="sourceBadge">Topicroom İletişim</span>
        </div>
        <span class="status-text">Çevrimiçi</span>
      </div>
      <div id="alertBox" class="alert alert-error"></div>
      <form id="contactForm" onsubmit="handleSend(event)">
        <div class="row">
          <div class="form-group">
            <label class="label" for="senderName">Adınız</label>
            <input class="input" type="text" id="senderName" name="name" placeholder="Adınız Soyadınız" required autocomplete="name" />
          </div>
          <div class="form-group">
            <label class="label" for="senderEmail">E-posta</label>
            <input class="input" type="email" id="senderEmail" name="email" placeholder="ornek@mail.com" required autocomplete="email" />
          </div>
        </div>
        <div class="form-group">
          <label class="label" for="msgSubject">Konu</label>
          <input class="input" type="text" id="msgSubject" name="subject" placeholder="Mesajınızın konusu" />
        </div>
        <div class="form-group">
          <label class="label" for="msgBody">Mesajınız</label>
          <textarea class="textarea" id="msgBody" name="message" placeholder="Mesajınızı buraya yazın..." required></textarea>
        </div>
        <button type="submit" id="submitBtn" class="submit-btn">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
          <span id="btnText">Mesajı Gönder</span>
        </button>
      </form>
    </div>
    <div id="successView" class="success-card">
      <div class="success-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
      </div>
      <div class="success-title">Mesajınız İletildi!</div>
      <div class="success-desc">
        Teşekkürler, mesajınız başarıyla ulaştırıldı. Belirttiğiniz e-posta adresinden en kısa sürede dönüş yapılacaktır.
      </div>
      <button type="button" class="btn-reset" onclick="resetForm()">Yeni Mesaj Gönder</button>
    </div>
  </div>
  <script>
    var urlParams = new URLSearchParams(window.location.search);
    var currentSource = (urlParams.get('source') || 'general').toLowerCase();
    var sourceMap = {
      'negron': 'Negron Show Blogu',
      'ali': 'Aleyulala Blogu',
      'github': 'GitHub - Saved',
      'general': 'Topicroom'
    };
    var badgeEl = document.getElementById('sourceBadge');
    if (badgeEl && sourceMap[currentSource]) {
      badgeEl.textContent = sourceMap[currentSource];
    }

    var APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx8B_7DX64ss6H1CxIyZ_KOUyzyfcEvX82pqmsPixLn4YVDaVtoPB5qp_qhj7ExckZR/exec';

    function showAlert(msg) {
      var box = document.getElementById('alertBox');
      if (!box) return;
      box.textContent = msg;
      box.style.display = 'block';
    }
    function hideAlert() {
      var box = document.getElementById('alertBox');
      if (box) box.style.display = 'none';
    }
    function setSubmitting(isSubmitting) {
      var btn = document.getElementById('submitBtn');
      var btnText = document.getElementById('btnText');
      if (!btn) return;
      btn.disabled = isSubmitting;
      if (isSubmitting) {
        btnText.innerHTML = '<span class="spinner"></span> Gönderiliyor...';
      } else {
        btnText.textContent = 'Mesajı Gönder';
      }
    }
    function handleSend(ev) {
      if (ev) ev.preventDefault();
      hideAlert();
      var name = (document.getElementById('senderName').value || '').trim();
      var email = (document.getElementById('senderEmail').value || '').trim();
      var subject = (document.getElementById('msgSubject').value || '').trim();
      var message = (document.getElementById('msgBody').value || '').trim();
      if (!name) { showAlert('Lütfen adınızı girin.'); return; }
      if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        showAlert('Lütfen geçerli bir e-posta adresi girin.');
        return;
      }
      if (!message) { showAlert('Lütfen mesajınızı yazın.'); return; }
      setSubmitting(true);
      var payload = {
        action: 'submit_contact',
        source: currentSource,
        name: name,
        email: email,
        subject: subject,
        message: message
      };

      fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      })
      .then(function(r) { return r.json(); })
      .then(function(res) {
        setSubmitting(false);
        if (res && res.ok) showSuccess();
        else showAlert((res && res.error) || 'Mesaj gönderilirken hata oluştu.');
      })
      .catch(function(err) {
        setSubmitting(false);
        // Even if CORS or response parsing fails, Google Apps Script often successfully executes doPost
        showSuccess();
      });
    }
    function showSuccess() {
      document.getElementById('formView').style.display = 'none';
      document.getElementById('successView').style.display = 'block';
    }
    function resetForm() {
      document.getElementById('contactForm').reset();
      document.getElementById('successView').style.display = 'none';
      document.getElementById('formView').style.display = 'block';
      hideAlert();
    }
  </script>
</body>
</html>
