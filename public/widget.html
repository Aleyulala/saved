<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>#İletişim - Nsone Bot</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #090b10;
      color: #f1f5f9;
      font-size: 13px;
      line-height: 1.45;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
    }

    /* CARD CONTAINER: Görsel 1 Düzeni (Layout Olarak Bu Güzel) + Görsel 2 UI */
    .cf-card-wrap {
      width: 380px;
      max-width: calc(100vw - 20px);
      height: 530px;
      max-height: min(94vh, 550px);
      background: #12141c;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 22px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.8), 0 2px 10px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
      animation: cfCardIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes cfCardIn {
      from { opacity: 0; transform: scale(0.96) translateY(6px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    /* HEADER: Görsel 2 (Beyaz Sohbet Balonu İkonu + #İletişim + Çevrimiçi • Nsone Bot) */
    .cf-header {
      padding: 18px 20px 14px 20px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex-shrink: 0;
    }
    .cf-header-icon {
      width: 22px;
      height: 22px;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .cf-header-icon svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }
    .cf-header-title-row {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .cf-header-title {
      font-size: 20px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.3px;
      line-height: 1.15;
    }
    .cf-header-subtitle {
      font-size: 12px;
      color: #9ca3af;
      font-weight: 500;
      line-height: 1.2;
    }
    .cf-header-divider {
      height: 1px;
      width: 100%;
      background: rgba(255, 255, 255, 0.08);
      margin-top: 10px;
    }

    /* CHAT STREAM (SABİT ALAN, ASLA ESNEYİP KÜÇÜLMEZ) */
    .cf-chat-messages {
      flex: 1 1 0%;
      min-height: 0;
      overflow-y: auto;
      padding: 14px 20px 12px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, 0.1) transparent;
    }
    .cf-chat-messages::-webkit-scrollbar {
      width: 5px;
    }
    .cf-chat-messages::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
    }

    /* BUBBLE STACK (Görsel 2 UI: Yuvarlak Köşeli Obsidiyen Baloncuklar) */
    .cf-bubble-stack {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .cf-chat-bubble {
      background: #191c26;
      border: 1px solid rgba(255, 255, 255, 0.07);
      color: #e2e8f0;
      padding: 12px 16px;
      border-radius: 16px;
      max-width: 90%;
      align-self: flex-start;
      font-size: 13px;
      line-height: 1.48;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
      animation: cfFadeIn 0.25s ease;
    }
    .cf-user-bubble {
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      color: #ffffff;
      border: none;
      border-radius: 16px;
      max-width: 85%;
      align-self: flex-end;
      text-align: left;
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.32);
    }
    .cf-bubble-meta {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 4px;
      font-size: 10.5px;
      color: #8b949e;
      margin-top: 5px;
    }
    .cf-double-check {
      width: 14px;
      height: 14px;
      stroke: #38bdf8;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }
    .cf-bubble-ack {
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.25);
      color: #a7f3d0;
      border-radius: 14px;
      padding: 10px 14px;
      font-size: 12.5px;
      align-self: flex-start;
      animation: cfFadeIn 0.25s ease;
    }

    @keyframes cfFadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* FORM & INPUT ROW (Görsel 1 Düzeni + Görsel 2 Uçak İkonu, Çakışma Yok) */
    .cf-form-area {
      padding: 6px 20px 8px 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
    }
    .cf-input-row {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
    }
    .cf-input-field {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
    }
    .cf-styled-input {
      width: 100%;
      height: 44px;
      background: #11131a;
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 12px;
      color: #ffffff;
      padding: 0 14px;
      font-size: 13.5px;
      outline: none;
      transition: all 0.2s ease;
      box-sizing: border-box;
    }
    .cf-styled-input:focus {
      border-color: #38bdf8;
      background: #13151e;
      box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.15);
    }
    .cf-styled-input::placeholder {
      color: #64748b;
    }

    /* ACTION BUTTONS (Görsel 2 Uçak İkonu + Squircle Kapat Butonu) */
    .cf-btn-send {
      width: 44px;
      height: 44px;
      min-width: 44px;
      min-height: 44px;
      border-radius: 12px;
      background: #252834;
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.2s ease;
    }
    .cf-btn-send:hover:not(:disabled) {
      background: #2e3342;
      color: #38bdf8;
      border-color: rgba(56, 189, 248, 0.35);
      transform: translateY(-1px);
    }
    .cf-btn-send:active:not(:disabled) {
      transform: scale(0.96);
    }
    .cf-btn-send:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }
    .cf-btn-send svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    .cf-btn-close {
      width: 44px;
      height: 44px;
      min-width: 44px;
      min-height: 44px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #94a3b8;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.2s ease;
    }
    .cf-btn-close:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #ffffff;
      transform: translateY(-1px);
    }
    .cf-btn-close:active {
      transform: scale(0.96);
    }
    .cf-btn-close svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      stroke-width: 2.2;
      stroke-linecap: round;
      fill: none;
    }

    /* FOOTER BAR (Görsel 2 UI: Sol Çevrimiçi Durumu + Sağ Yazıyor... Hapı) */
    .cf-footer-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 22px 14px 22px;
      width: 100%;
      box-sizing: border-box;
      flex-shrink: 0;
    }
    .cf-footer-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11.5px;
      color: #10b981;
      font-weight: 600;
    }
    .cf-online-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 6px rgba(16, 185, 129, 0.7);
      display: inline-block;
    }

    /* YAZIYOR... HAPI (Görsel 2 Birebir: Sağ Alt Köşede Şık Hap) */
    .cf-typing-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #1a1d27;
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 20px;
      padding: 3px 11px;
      font-size: 11px;
      color: #8b949e;
      transition: opacity 0.2s ease;
    }
    .cf-typing-dots {
      display: flex;
      gap: 3px;
    }
    .cf-typing-dots span {
      width: 3.5px;
      height: 3.5px;
      background: #38bdf8;
      border-radius: 50%;
      animation: cfBlink 1.4s infinite;
    }
    .cf-typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .cf-typing-dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes cfBlink {
      0%, 80%, 100% { opacity: 0.2; transform: scale(0.8); }
      40% { opacity: 1; transform: scale(1.1); }
    }

    /* SOSYAL MEDYA BUTONU VE GRİDİ */
    .cf-social-invite {
      margin-top: 8px;
    }
    .cf-social-trigger-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.28);
      color: #38bdf8;
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .cf-social-trigger-btn:hover {
      background: rgba(56, 189, 248, 0.22);
      transform: translateY(-1px);
    }
    .cf-social-links-grid {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 8px;
    }
    .cf-soc-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 12px;
      border-radius: 10px;
      font-size: 12px;
      text-decoration: none;
      color: #f1f5f9;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      transition: all 0.2s ease;
    }
    .cf-soc-pill:hover {
      background: rgba(255, 255, 255, 0.1);
      transform: translateX(2px);
    }
    .cf-soc-pill svg {
      width: 15px;
      height: 15px;
      flex-shrink: 0;
    }
    .cf-soc-pill.ig svg { stroke: #e1306c; }
    .cf-soc-pill.tg svg { stroke: #229ed9; }
    .cf-soc-pill.yt svg { stroke: #ff0000; }
    .cf-soc-pill.gh svg { stroke: #a78bfa; }

    @media (max-width: 480px) {
      .cf-card-wrap {
        width: min(calc(100vw - 16px), 380px) !important;
        border-radius: 20px !important;
      }
    }
  </style>
</head>
<body>
  <div class="cf-card-wrap" id="cfCard">
    <!-- HEADER: Görsel 2 Birebir (Beyaz Sohbet Balonu İkonu + #İletişim + Çevrimiçi • Nsone Bot) -->
    <div class="cf-header">
      <div class="cf-header-icon">
        <svg viewBox="0 0 24 24">
          <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/>
        </svg>
      </div>
      <div class="cf-header-title-row">
        <h2 class="cf-header-title">#İletişim</h2>
        <span class="cf-header-subtitle">Çevrimiçi • Nsone Bot</span>
      </div>
      <div class="cf-header-divider"></div>
    </div>

    <!-- CHAT MESSAGES STREAM -->
    <div class="cf-chat-messages" id="cfChatMessages">
      <div class="cf-bubble-stack" id="cfBubbleStack">
        <div class="cf-chat-bubble">
          <span>Merhaba! 👋 dostum</span>
        </div>
        <div class="cf-chat-bubble">
          <span>Bir sorunuz, öneriniz veya mesajınız varsa lütfen aşağıdaki formu doldurarak bize iletin.</span>
        </div>
        <div class="cf-chat-bubble">
          <span>Size e-posta adresinizden en kısa sürede dönüş yapacağız.</span>
          <div class="cf-bubble-meta">
            <span>Şimdi</span>
            <svg class="cf-double-check" viewBox="0 0 24 24"><path d="M18 6L7 17l-5-5M22 10l-7.5 7.5L13 16"></path></svg>
          </div>
        </div>
      </div>
    </div>

    <!-- FORM & INPUT ROW (Görsel 1 Düzeni + Görsel 2 Uçak Butonu) -->
    <div class="cf-form-area">
      <form id="cfForm" onsubmit="return false;">
        <div class="cf-input-row">
          <div class="cf-input-field">
            <input type="text" class="cf-styled-input" id="cfInputField" placeholder="Adınız ve soyadınız..." autocomplete="name" required />
          </div>
          <button type="button" class="cf-btn-send" id="cfActionBtn" title="İleri" onclick="handleStepAction()">
            <svg viewBox="0 0 24 24">
              <line x1="22" y1="2" x2="11" y2="13"></line>
              <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
          </button>
          <button type="button" class="cf-btn-close" id="cfCloseBtn" title="Kapat" onclick="handleWidgetClose()">
            <svg viewBox="0 0 24 24">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>
      </form>
    </div>

    <!-- FOOTER BAR: Görsel 2 Birebir (Sol Durum + Sağ Yazıyor... Hapı) -->
    <div class="cf-footer-bar">
      <div class="cf-footer-status">
        <span class="cf-online-dot"></span>
        <span class="cf-status-label">Nsone Bot • Çevrimiçi</span>
      </div>
      <div class="cf-typing-pill" id="cfTypingPill">
        <div class="cf-typing-dots"><span></span><span></span><span></span></div>
        <span class="cf-typing-text">Nsone Bot yazıyor...</span>
      </div>
    </div>
  </div>

  <script>
    var APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby2BbaRplWrOLZDiTba4Wnn9LAy6m2IuIBDmhFS6aSYr-fagSGVKbw_PYb9aajK39jZ/exec';
    var MAX_MESSAGES = 3;

    var currentStep = 0; // 0: Name, 1: Email, 2: Message 1, 3: Message 2, 4: Message 3
    var chatData = {
      name: '',
      email: '',
      messagesSent: 0
    };

    var inputField = document.getElementById('cfInputField');
    var actionBtn = document.getElementById('cfActionBtn');
    var bubbleStack = document.getElementById('cfBubbleStack');
    var messagesArea = document.getElementById('cfChatMessages');
    var typingPill = document.getElementById('cfTypingPill');

    function scrollToBottom() {
      if (messagesArea) {
        messagesArea.scrollTo({ top: messagesArea.scrollHeight, behavior: 'smooth' });
      }
    }

    function appendUserBubble(text) {
      if (!bubbleStack) return;
      var el = document.createElement('div');
      el.className = 'cf-chat-bubble cf-user-bubble';
      var safeText = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      el.innerHTML = '<span>' + safeText + '</span>' +
        '<div class="cf-bubble-meta">' +
          '<span>Şimdi</span>' +
          '<svg class="cf-double-check" viewBox="0 0 24 24"><path d="M18 6L7 17l-5-5M22 10l-7.5 7.5L13 16"></path></svg>' +
        '</div>';
      bubbleStack.appendChild(el);
      scrollToBottom();
    }

    function appendBotBubble(htmlText, isAck) {
      if (!bubbleStack) return;
      var el = document.createElement('div');
      el.className = 'cf-chat-bubble' + (isAck ? ' cf-bubble-ack' : '');
      el.innerHTML = htmlText;
      bubbleStack.appendChild(el);
      scrollToBottom();
    }

    function sendToBackend(payload) {
      try {
        var formData = new URLSearchParams();
        for (var k in payload) {
          if (payload.hasOwnProperty(k)) formData.append(k, payload[k]);
        }
        fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8' },
          body: formData.toString()
        }).catch(function(e) { console.warn('Apps Script fetch silent err:', e); });
      } catch (err) {
        console.warn('sendToBackend err:', err);
      }
    }

    function handleStepAction() {
      var val = (inputField.value || '').trim();
      if (!val) {
        inputField.focus();
        return;
      }

      if (currentStep === 0) {
        // İsim Kaydet
        chatData.name = val;
        appendUserBubble(val);
        inputField.value = '';
        currentStep = 1;

        inputField.type = 'email';
        inputField.placeholder = 'E-posta adresiniz...';
        inputField.autocomplete = 'email';
        inputField.focus();
      } else if (currentStep === 1) {
        // E-posta Doğrula & Kaydet
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val)) {
          alert('Lütfen geçerli bir e-posta adresi girin.');
          inputField.focus();
          return;
        }
        chatData.email = val;
        appendUserBubble(val);
        inputField.value = '';
        currentStep = 2;

        inputField.type = 'text';
        inputField.placeholder = 'Mesajınızı buraya yazın...';
        inputField.autocomplete = 'off';
        inputField.focus();
      } else if (currentStep >= 2) {
        // Mesaj Gönder
        if (chatData.messagesSent >= MAX_MESSAGES) return;

        chatData.messagesSent++;
        appendUserBubble(val);
        inputField.value = '';

        // Backend'e ilet
        sendToBackend({
          name: chatData.name,
          email: chatData.email,
          message: val,
          message_seq: chatData.messagesSent,
          source: 'topicroom_widget'
        });

        if (chatData.messagesSent === 1) {
          setTimeout(function() {
            appendBotBubble('<span>Mesajını ilettik! İletmek istediğin başka bir konu varsa aşağıdan yazmaya devam edebilirsin. 👇 (1/3)</span>', true);
            inputField.placeholder = 'Ek mesajınızı yazın... (2/3)';
            inputField.focus();
          }, 350);
        } else if (chatData.messagesSent === 2) {
          setTimeout(function() {
            appendBotBubble('<span>Ek mesajını da ilettik. ✓✓ (2/3)</span>', true);
            inputField.placeholder = 'Son mesajınızı yazın... (3/3)';
            inputField.focus();
          }, 350);
        } else if (chatData.messagesSent === 3) {
          setTimeout(function() {
            appendBotBubble('<span>Mesajın kaydedildi. En kısa sürede e-posta adresine dönüş sağlayacağız. 👍 (3/3)</span><div class="cf-social-invite"><button type="button" id="cfSocialTriggerBtn" class="cf-social-trigger-btn" onclick="showSocialLinks()"><svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>Sosyal Ağlarımıza Katılmak İster misin? ✨</button></div>', true);
            inputField.disabled = true;
            inputField.placeholder = 'Maksimum mesaj limitine ulaşıldı (3/3).';
            actionBtn.disabled = true;
            actionBtn.style.opacity = '0.35';
            actionBtn.style.cursor = 'not-allowed';
          }, 350);
        }
      }
    }

    if (inputField) {
      inputField.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          handleStepAction();
        }
      });
    }

    function showSocialLinks() {
      var inviteBtn = document.getElementById('cfSocialTriggerBtn');
      if (inviteBtn) {
        inviteBtn.disabled = true;
        inviteBtn.style.opacity = '0.5';
        inviteBtn.style.pointerEvents = 'none';
      }
      var socialHtml = '<span>🌟 <b>Topluluk & Sosyal Ağlarımız:</b></span>' +
        '<div class="cf-social-links-grid">' +
          '<a href="https://www.instagram.com/aleyul.ala/" target="_blank" rel="noopener" class="cf-soc-pill ig">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg>' +
            '<span>Instagram (@aleyul.ala)</span>' +
          '</a>' +
          '<a href="https://t.me/aleyyulala" target="_blank" rel="noopener" class="cf-soc-pill tg">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>' +
            '<span>Telegram (@aleyyulala)</span>' +
          '</a>' +
          '<a href="https://www.youtube.com/@ngronn/post" target="_blank" rel="noopener" class="cf-soc-pill yt">' +
